[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ehrdoc"
version = "0.2.0"
description = "Site-level EHR documentation variation via Venn vectors and angular separation (eICU)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3",
  "numpy>=1.24,<2.3",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "pyarrow>=14",
  "matplotlib>=3.7",
  "matplotlib-venn>=0.11",
  "tableone>=0.9.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
umap = ["umap-learn>=0.5"]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
