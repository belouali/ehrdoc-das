# SENSITIVITY: condition-specific, mutually exclusive medication classes.
# Diabetes unchanged. For hypertension, CHF and AF, every drug class that appears
# in more than one condition's guideline list (ACE inhibitors, ARBs, beta-blockers,
# digoxin, SGLT2 inhibitors, heparins) is dropped, and each remaining shared class
# is assigned to the condition for which it is most specific:
#   hypertension: thiazide-type diuretics, dihydropyridine CCBs, alpha-blockers,
#                 central alpha-2 agonists, direct vasodilators, aliskiren,
#                 non-MRA potassium-sparing diuretics
#   chf:          loop diuretics, MRAs, ARNI, isosorbide dinitrate, ivabradine
#   af:           antiarrhythmics, oral anticoagulants (warfarin, DOACs), non-DHP CCBs
diabetes:
  diagnosis:
    include:
    - diabetes
    - diabetic
    - T2DM
    - type 2 diabetes
    - DM type 2
    - DM type II
    - NIDDM
    exclude:
    - type 1
    - T1DM
    - IDDM
    - gestational
  past_history:
    include:
    - diabetes
    - diabetic
    - T2DM
    - type 2 diabetes
    - DM type 2
