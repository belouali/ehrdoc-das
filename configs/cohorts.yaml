# Cohort definitions / thresholds (edit as needed)
# Use per-condition minimum N per hospital to reduce sampling noise in 7-lobe proportions.
cohorts:
  main:
    min_records_per_hospital: 100
  sensitivity_large_hospitals:
    min_records_per_hospital: 2000

# Primary analysis thresholds (min patients per hospital per condition)
phenotype_thresholds:
  diabetes: 100
  hypertension: 100
  chf: 100
  af: 100

# Sensitivity analysis: run at multiple thresholds to show stability
sensitivity_thresholds: [50, 100, 200, 300, 500]
