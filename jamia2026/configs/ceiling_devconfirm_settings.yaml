    type_matched: "200 draws: pool hospitals ranked by the number of MIMIC-IV type matches (Northeast, teaching, >= 500 beds; missing = no match), top 10 with random tie-breaks"
    nearest10_non_ne: "nearest 10 by the CHF DHM angle among non-Northeast pool hospitals"
    random10_non_ne: "200 random draws of 10 non-Northeast pool hospitals"
  size_control: "every arm subsampled to n = min(W1_mimic training size, 5th percentile of type_matched and random10_non_ne sizes, nearest10_non_ne size); nearest arms 10 repeats averaged, each draw subsampled once"
