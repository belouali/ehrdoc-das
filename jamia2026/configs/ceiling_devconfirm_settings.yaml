    T1: "AUROC(nearest10) - mean AUROC(type_matched): DAS beats a hospital-type rule"
    T2: "AUROC(nearest10_non_ne) - mean AUROC(random10_non_ne): DAS works without the region"
  statistic: "paired patient-level bootstrap, 2,000 resamples, draw means from the first 100 draws; one-sided p, Holm across T1 and T2; percentile among the 200 draws"
  success: "Holm p < 0.05 for each test, reported pass or fail"
