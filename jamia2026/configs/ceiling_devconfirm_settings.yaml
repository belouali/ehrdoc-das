# Ceiling analysis and development/confirmation split for the construct search.
# Drafted 2026-11-06. C1 and D1 approved by the user 2026-11-06, before computing.
# Sources: D diagnosis, H past history, A home medication, M in-stay medication,
# U undocumented (lab positive, no D/H/M record). DHM = the paper's construct.
# M1 = the paper's mortality model (APACHE IV score). Case mix = hospital means of
# the 19 script-07 patient features (age, sex, vital signs, GCS, unit type).
status: locked  # C1 and D1; the D1 winner is locked separately after approval

C1_ceiling:
  status: locked  # approved by the user 2026-11-06, before computing
  question: "How much AUROC can any choice of 10 eICU training hospitals gain over random 10 for a target hospital?"
  model: "M1 (APACHE IV score design, scripts/m1_model.py), C = 1e6 pooled, C = 1.0 for single-source fits as in script 10"
  outcome: "hospital death, eICU M1 cohort"
  targets: "the development half of the 82 eICU targets (>= 300 stays, >= 20 deaths), see D1"
  pool: "every other eICU hospital with >= 100 M1-eligible stays (141 hospitals in total)"
  target_split: "each target's stays split 50/50 stratified by death: selection half S, evaluation half E; seed fixed"
  arms:
    random: "200 draws of 10 pool hospitals, AUROC on E"
    oracle_rank_best: "fit M1 on each pool hospital alone, rank by AUROC on S, top 10 pooled, AUROC on E"
    oracle_rank_worst: "bottom 10 of the same ranking"
    oracle_set_best: "best of the 200 random draws by AUROC on S, scored on E"
    oracle_set_worst: "worst of the 200 random draws by AUROC on S, scored on E"
    das_nearest: "DHM nearest-10 per condition (the paper's DHM), scored on E"
    casemix_nearest: "script-07 case-mix nearest-10, scored on E"
  size_control: "as script 12: every set subsampled to min(oracle set, nearest set, 5th percentile of random sizes); oracle and nearest 3 repeats averaged"
  k: {primary: 10, secondary: [5, 20]}
  readouts:
    ceiling_gain: "mean over targets of AUROC_E(oracle_rank_best) - mean AUROC_E(random), 2,000 target-bootstrap CI"
    lottery_range: "per target SD and 5th-95th percentile range of random-10 AUROC on E, median over targets"
    capture: "DAS gain / ceiling gain and case-mix gain / ceiling gain, same targets"
  decision_rule:
    small: "ceiling_gain < 0.010: report that hospital selection has little room in eICU for this model; move the search to tasks (Part A) and similarity weighting"
    room: "ceiling_gain >= 0.030: describe which hospital traits separate oracle-best sets from random (DAS, case mix, region, size, teaching), on the development half only"
    between: "0.010 to 0.030: run both"
  mimic_secondary:
    status: locked  # approved by the user 2026-11-06, before computing
    design: "MIMIC-IV as one target: select on the 25% development subset (mimic_split reference = False is the 75% evaluation subset), score on the 75% evaluation subset"
    caveat: "MIMIC-IV outcomes were already read for stage 4, so this is labeled not blind"
  seed: 20261107

D1_dev_confirm:
  status: locked  # approved by the user 2026-11-06, before computing
  split: "82 eICU targets into a development half (41) and a confirmation half (41), stratified by region and size tertile, seed fixed, written once to results/target_split.csv"
  rule: "the search reads outcomes of development targets only; confirmation targets serve only as training hospitals until the confirmation run"
  known_exposure: "scripts 10 and 12 already read all 82 targets for DHM, DHAM, DAM and the learned distance; those four are reported as already seen and cannot be the confirmed winner"
  search_space:
    constructs: [DHM, DHAM, DAM, DHM-U diabetes, "multi-condition joined vector (the 4 conditions, each unit length)", "B9 anchored profile"]
    rule: ["nearest-k selection", "similarity weighting, weight = exp(-angle / tau), tau on a grid of 5 values", "rank average of DAS and case mix"]
    k: [5, 10, 20]
    task: "in-hospital death now; Part A tasks enter only after their settings are approved"
  budget: "at most 40 candidates, every one logged in results/search_ledger.csv with its result, including failures"
  winner_metric: "mean size-controlled AUROC gain over random-10 on development targets"
  lock: "the user approves one winner, with every setting, before the confirmation run"
  confirmation:
    test: "winner vs random-10 on the 41 confirmation targets, once"
    success: "mean gain > 0 with the lower 95% target-bootstrap bound > 0"
    power_note: "script 12 gave CI half-widths near 0.003 on 78 targets, so about 0.0045 on 41; gains below about 0.005 will not be confirmed"
    external: "then MIMIC-IV 75% evaluation subset, labeled not blind"

E1_exclusion:
  status: locked  # approved by the user 2026-11-06, before computing
  question: "Does training on every pool hospital except the farthest by DAS beat excluding the same number at random?"
  why: "C1 found the downside of a bad choice (about -0.06 at k = 10) far larger than the upside (about +0.01)"
  model: "M1, C = 1e6, as C1"
  targets: "the 41 development targets only (D1)"
  pool: "every other eICU hospital with >= 100 M1 stays, as C1"
  target_split: "each target's stays split 50/50 by death into S and E with seed 20261108; rules use no outcomes, so only E is scored, and S serves only the oracle"
  exclude_share: [0.10, 0.25, 0.50]   # share of pool hospitals dropped
  candidates:  # 21, counted against the D1 budget of 40
    das_condition: "drop the farthest by the DHM angle (the paper's construct), each of the 4 conditions (12)"
    das_joined: "drop the farthest by the mean DHM angle over the 4 conditions (3)"
    casemix: "drop the farthest by the script-07 case-mix distance (3)"
    das_and_casemix: "drop the farthest by the average of the DAS-joined rank and the case-mix rank (3)"
  comparators:
    random_exclusion: "50 draws dropping the same number of hospitals at random (primary comparator)"
    pooled_all: "every pool hospital (secondary)"
    oracle_exclusion: "drop the worst by single-source AUROC on S, as in C1 (the ceiling for exclusion; not a candidate)"
  size_control: "the rule set and each random draw subsampled to the smaller of the rule set and the 5th percentile of random sizes; rule sets 3 repeats averaged"
  readouts:
    primary: "mean over targets of AUROC_E(rule) - mean AUROC_E(random exclusion), 2,000 target-bootstrap CI"
    secondary: ["rule minus pooled_all", "share of the oracle exclusion gain captured", "share of targets with a gain"]
  winner: "the candidate with the largest primary gain enters the D1 winner choice; nothing is confirmed here"
  seed: 20261108

D1_winners:
  status: locked  # winners chosen by the user 2026-11-06 ("both"); block approved by the user 2026-11-06, before computing
  note: "D1 named one winner; the user chose two, so the two confirmation tests are Holm-corrected"
  W1:
    task: "A3, ICU stay > 7 days (features as scripts/21_task_gate.py)"
    rule: "nearest 10 by the CHF DHM angle (the paper's construct)"
    development: "+0.016 (0.009 to 0.023), 39 targets"
  W2:
    task: "A4, ICU readmission in the same hospitalization, among stays discharged alive from the ICU"
    rule: "nearest 10 by the diabetes DHM angle"
    development: "+0.025 (0.006 to 0.045), 32 targets"
  confirmation:
    targets: "the 41 confirmation targets in results/target_split.csv, read here for the first time; A4 needs >= 20 events per target; a target without a DHM vector for the condition is skipped"
    pool: "every other eICU hospital with >= 100 stays in the task cohort (as script 22)"
    evaluation: "all of the target's stays (the rule reads no outcomes, so no selection half is needed)"
    comparator: "200 random draws of 10 pool hospitals"
    size_control: "as script 22: nearest subsampled to min(nearest, 5th percentile of random sizes), 3 repeats averaged"
    model: "logistic regression, p0 pipeline, C = 1e6"
    statistic: "mean over targets of AUROC(nearest) - mean AUROC(random), 2,000 target-bootstrap CI; one-sided p = share of bootstrap means <= 0"
    success: "Holm-adjusted one-sided p < 0.05 for each winner (equivalently the lower bound above 0 after Holm)"
    descriptive: "case-mix nearest-10 on the same targets; not a test"
    reported_regardless: "both results, pass or fail"
  external: "MIMIC-IV for the confirmed winners only, settings drafted after this run, labeled not blind"
  seed: 20261111

W1_mimic:
  status: locked  # approved by the user 2026-11-06, before computing
  question: "Does the confirmed W1 rule (nearest 10 eICU hospitals by the CHF DHM angle) beat random 10 for ICU stay > 7 days in MIMIC-IV?"
  blinding: "ICU stay > 7 days has not been modelled in MIMIC-IV in this project (ICU out-times were used only for windows and cohort rules); MIMIC-IV mortality was read earlier, and MIMIC-IV played no part in choosing W1"
  training:
    data: "eICU, task cohort and features as scripts/21_task_gate.py: M1 inputs + Charlson + 12 flags (diabetes, hypertension, CHF, AF x D, H, M)"
    pool: "eICU hospitals with >= 100 stays in the task cohort and a CHF DHM angle to MIMIC-IV in results/das_to_mimic.csv"
    nearest: "10 smallest CHF DHM angles to MIMIC-IV, reference ref_2011_2019 (as stage 4)"
    model: "logistic regression, p0 pipeline, C = 1e6"
  evaluation:
    cohort: "MIMIC-IV 75% evaluation subset (mimic_split reference = False), M1 cohort (first qualifying ICU stay, alive and in the ICU at 24 h)"
    outcome: "icustays los > 7 days"
    features: "mimic_m1_features + Charlson (mimic_m2_features) + D and M from mimic_flags + H from mimic_history_flags (index discharge summary)"
  comparator: "500 random draws of 10 pool hospitals (as stage 4)"
  size_control: "as stage 4: nearest subsampled to min(nearest, 5th percentile of random sizes), 10 repeats averaged; each random draw subsampled once"
  statistic: "AUROC(nearest) - mean AUROC(random); 2,000 patient-level bootstrap CI with models fixed, random mean from the first 100 draws; percentile of nearest among the 500 draws"
  success: "difference > 0 with the lower 95% bound above 0; reported pass or fail"
  descriptive: ["case-mix nearest-10 (results/casemix_distance.csv)", "reference ref_all_years", "calibration-in-the-large and slope"]
  seed: 20261112

W1_pooled:
  status: locked  # approved by the user 2026-11-06, before computing
  question: "Does the W1 rule (nearest 10 eICU hospitals by the CHF DHM angle) beat training on every pool hospital for ICU stay > 7 days in MIMIC-IV?"
