# DAS screen: tasks, conditions, tables. Positive controls B5-B8 (P1-P8) approved by the user and locked 2026-11-06 before any were computed. Parts A-C and validation remain draft.
# Mirrors analysis plan/DAS_screen_draft.md. Switch to "locked" only after the user approves.
status: draft
positive_controls_status: locked
order: [task, condition, table, validation]
task:
  candidates: [A1_mortality_M1, A2_mortality_M2, A3_los_gt7d, A4_icu_readmission, A5_comorbidity_only]
  pass: "ablation loss >= 0.01 AUROC and perturbation loss >= 0.01 AUROC, or |CITL shift| >= 0.1"
condition:
  candidates: [diabetes, hypertension, chf, af, copd, ckd, cirrhosis, cancer, stroke]
  optional: [obesity, malnutrition]
  anchors:
    diabetes: "insulin or glucose"
    chf: "BNP or loop diuretic"
    ckd: "race-free CKD-EPI 2021 eGFR < 60 from a pre-ICU or stable creatinine; B2 adjusted for race, gaps reported by race"
    copd: "inhaled bronchodilator or steroid"
    cirrhosis: "bilirubin, INR or lactulose"
  pass:
    B1_signal: "share of hospital pairs beyond split-half noise >= 0.50"
    B2_discretion: "hospital SD (logit) of documentation among anchor-positive >= 0.3, bootstrap CI excludes 0"
    B3_casemix: "Mantel rho(DAS distance, case-mix distance) < 0.3"
    B4_shared_habit: "reported, not a gate"
    no_anchor: "fails B2"
table:
  candidates: [diagnosis, past_history, home_meds, instay_meds]
  optional: [labs_ordered, procedures]
  pass:
    C1_independence: "P(B|A) < 0.8 or adds B1 signal"
    C2_same_meaning: "lobe share ratio within 2-fold and same record type"
    C3_coverage: ">= 90% of hospitals with entries, missingness ICC < 0.2"
    C4_stability: "no reference year group below half the median share"
validation:
  primary: "eICU leave-target-out, 82 large targets, chosen task"
  secondary: "MIMIC-IV forward and reverse (not blind)"
  ideal: "second external ICU dataset"
positive_controls:
  common: "aggregates only; one prespecified model per prediction; Holm across P1, P2, P4-P8; P3 exploratory; failed predictions reported"
  B5_race_egfr:
    creatinine: "MIMIC-IV primary: latest creatinine from an earlier admission/ED visit within 365 days; eICU secondary: lowest ICU creatinine"
    P1: "race-free eGFR 45-60: OR(documented CKD, Black vs non-Black) < 1, 95% CI excludes 1; logistic, hospital RE, age, sex, eGFR"
    P2: "band (45-60 vs <30) x race interaction CI excludes 0; control-band OR CI includes 1"
    P3: "exploratory: MIMIC-IV 3.1 P1 OR closer to 1 in 2020-2022 than 2011-2019; CI reported, no test"
    P4: "Spearman(hospital CKD DAS, Black share) > 0, 2,000 hospital bootstrap CI excludes 0; eICU hospitals >= 100 stays; no race adjustment"
  B6_obesity_bmi:
    P5: "trend OR per BMI class (30-34.9, 35-39.9, >=40) > 1, CI excludes 1; logistic, hospital RE, age, sex"
    P6: "hospital RE SD (logit) >= 0.5, bootstrap CI excludes 0.3; also with labs per patient-day"
  B7_lab_gradient:
    stages:
      aki: "KDIGO creatinine stage 1/2/3 from first ICU creatinine"
      hyponatremia: "130-134 / 125-129 / <125 mmol/L"
      anemia: "Hb 10-10.9 / 8-9.9 / <8 g/dL"
      thrombocytopenia: "plt 100-149 / 50-99 / <50 x10^9/L"
    P7: "per condition, trend OR per stage > 1, CI excludes 1; worst ICU value; logistic, hospital RE, age, sex; top-stage rate reported"
    P8: "per condition, SD(hospital RE, mildest) / SD(most severe) > 1, bootstrap CI excludes 1; also with labs per patient-day"
  B8_intensity: "labs per patient-day per hospital; P6, P8, B2 with and without adjustment; Spearman with DAS reported; no prediction"
B4_shared_habit:
  status: locked  # approved by the user 2026-11-06, before computing
  conditions: [obesity, aki, hyponatremia, anemia, thrombocytopenia]
  hospital_effect: "random-intercept mode from P5/P7 models (class or stage, age, sex); second version + labs per patient-day"
  hospitals: "eICU hospitals with >= 30 anchor-positive stays for each of the five conditions"
  P9: "median of 10 pairwise Spearman correlations > 0, 1,000 hospital bootstrap CI excludes 0"
  P10: "PC1 variance share above 1,000 per-condition hospital permutations, one-sided p < 0.05; loadings reported"
  P11: "descriptive: PC1 vs labs per patient-day, size, teaching, region"
  P12: "Spearman(|PC1|, median DHM angle to pooled eICU over the 4 published conditions) > 0, 2,000 hospital bootstrap CI excludes 0"
  multiplicity: "Holm across P9, P10, P12"
B9_undocumented_lobe:
  status: locked  # approved by the user 2026-11-06, before computing
  part1_diabetes:
    construct: "DHM-U: 7 published DHM lobes + U (anchor positive, no D/H/M record); population = recorded in D/H/M or anchor positive"
    anchor: ">= 2 glucose values >= 200 mg/dL, ICU admission -6 h to ICU discharge"
    eicu_labs: [glucose, bedside glucose]
    mimic_itemids: [50809, 50931, 52027, 52569]
    sensitivity: ["one value >= 200", "two values >= 24 h apart", "primary anchor excluding stays with systemic corticosteroids"]
    reference: "pooled eICU; hospitals >= 100 records; MIMIC-IV 2011-2019 reference subset"
    P13: "share of eICU hospital pairs above split-half noise floor, DHM-U minus DHM > 0, 1,000 hospital bootstrap CI excludes 0"
    P14: "Spearman(DHM-U angle, |diabetes documentation effect|) minus Spearman(DHM angle, |effect|) > 0, 2,000 hospital bootstrap CI excludes 0; effect = RE mode among anchor-positive stays, age, sex, n glucose >= 200"
    P15: "check: |Spearman(DHM-U angle, glucose values per patient-day)| < 0.3"
    descriptive: "MIMIC-IV percentile among eICU hospitals, DHM-U vs DHM"
  part2_profile:
    conditions: [obesity, aki, hyponatremia, anemia, thrombocytopenia]
    lobes: "per condition D only, H only, D+H, U; each condition vector scaled to unit length; 20-entry joined vector"
    hospitals: "eICU, >= 30 anchor-positive stays for every condition"
    P16: "share of pairs above split-half noise >= 50% and > median of the 4 published DHM conditions; 1,000 hospital bootstrap CI of the difference excludes 0"
    P17: "check: |Spearman(profile angle, labs per patient-day)| < 0.3"
    P18: "descriptive: Spearman(profile angle, |PC1| from B4)"
    mimic: "second phase, ICD rules and note terms to be drafted"
  multiplicity: "Holm across P13, P14, P16"
A_task_screen:
  status: locked  # approved by the user 2026-11-06, before computing
  why: "C1 and E1 found almost no room for hospital selection with in-hospital death and M1; documentation may matter more for other tasks"
  known_before_drafting:
    A1_mortality_M1: "done: C1 ranking ceiling +0.006 at k = 10, E1 no gain; dropped"
    A2_mortality_M2: "done: adding Charlson raises hospital-grouped CV AUROC by 0.004 (0.811 to 0.815), under the 0.01 ablation bar; dropped"
    prevalence_read: "aggregate only, eICU M1 cohort: ICU stay > 7 days 11.0%, a later unit stay in the same hospitalization 12.6%"
  tasks:
    A3_los_gt7d:
      outcome: "ICU length of stay > 7 days (eICU unitdischargeoffset; MIMIC-IV icustays los), among stays alive at 24 h"
      features: "M1 inputs + Charlson + the 12 condition flags (4 conditions x D, H, M)"
    A4_icu_readmission:
      outcome: "a later ICU stay in the same hospitalization after the index ICU discharge alive (eICU unitvisitnumber within patienthealthsystemstayid, ICU unit types only; MIMIC-IV icustays within hadm_id)"
      features: "M1 inputs + index LOS + Charlson + the 12 condition flags"
      cohort: "index stays discharged alive from the ICU"
    A5_comorbidity_only:
      outcome: "in-hospital death"
      features: "age, sex, Charlson and the 12 condition flags only; a deliberately documentation-heavy model"
  gate:  # outcomes from eICU training data only, hospital-grouped 5-fold CV; no target selection yet
    ablation: "AUROC loss when Charlson and the 12 flags are removed (for A5: against age and sex only)"
    perturbation: "in each training fold, move every hospital's documentation rate per flag to the 10th and then the 90th percentile hospital rate by random deletion or addition of flags; report the AUROC and calibration-in-the-large change at held-out hospitals, worst of the two directions"
    pass: "ablation loss >= 0.01 AUROC and perturbation loss >= 0.01 AUROC, or |CITL shift| >= 0.1 (unchanged from the draft)"
  then_for_passing_tasks:
    ceiling: "the C1 design for that task, development half only, k = 10 primary"
    candidates: "DAS nearest (the paper's DHM) per condition and joined, case-mix nearest; counted against the D1 budget (19 left)"
    order: "the ceiling first; if it is under 0.010, stop for that task"
  mimic: "secondary, after a winner is approved; not blind"
  model: "logistic regression, the scripts/p0_model.py pipeline, C = 1e6"
  seed: 20261109
