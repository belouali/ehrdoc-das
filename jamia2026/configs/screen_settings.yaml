A_condition_scan:
  status: locked  # drafted 2026-11-07 after the user asked for a justified rule for every threshold; approved by the user 2026-11-07 ('You can lock and run the gates', once both gate numbers were sourced), before any gate was computed
  why: "A_construct_condition_ext part 2 stopped at its outcome-free checks: its coverage bars (60 targets, 100 hospitals) had no source, and its B1 gate would also have excluded CHF and AF; this block replaces part 2 step 2 with a rule whose every threshold has a stated source; part 2 checks stay reported"
  tasks: [A3_los_gt7d, A6_hospital_los_gt14d]  # models and features unchanged
  conditions:
    paper: [diabetes, hypertension, chf, af]  # the paper's phenotypes (phenotypes.yaml), unchanged
    charlson:  # the 17 Charlson components of scripts/11_charlson_features.py, severity splits merged; chf and diabetes are already in the paper's four
      myocardial_infarct: [myocardial_infarct]
      peripheral_vascular_disease: [peripheral_vascular_disease]
      cerebrovascular_disease: [cerebrovascular_disease]
      dementia: [dementia]
      chronic_pulmonary_disease: [chronic_pulmonary_disease]
      rheumatic_disease: [rheumatic_disease]
      peptic_ulcer_disease: [peptic_ulcer_disease]
      liver_disease: [mild_liver_disease, severe_liver_disease]
      paraplegia: [paraplegia]
      renal_disease: [renal_disease]
      cancer: [malignant_cancer, metastatic_solid_tumor]
      aids: [aids]
    extra:
      obesity: "BMI-anchored D-U profile as in configs/phenotypes_ext.yaml (user's choice 2026-11-07)"
  sources:
    D: "paper's four: the paper's text rules; Charlson conditions: the Quan ICD rules (mimic-code charlson.sql, run unchanged) on the eICU icd9code column, as in script 11"
    H: "paper's four: the paper's rules; Charlson conditions: the eICU pastHistory picklist mapping of script 11"
    M: "in-stay medication, only where a drug class is specific to the condition (guideline classes, listed per condition in configs/phenotypes_ext.yaml or a successor file approved first) and the eICU medication table contains it; otherwise home medication (A) if it contains it; otherwise the condition is dropped (three_source_rule)"
    medication_standard: "WHO ATC classes for the eight Charlson conditions (chosen 2026-11-07, 'Map to RxNorm/ATC'), with class members and brand names read from NLM RxNav (user's choice 2026-11-07, 'Use NLM service'; only ATC codes and RxNorm identifiers are sent, eICU drug names are matched locally); RxNorm 02-Nov-2026; ATC groups and method in configs/phenotypes_scan.yaml, script 29_atc_rxnav.py; the paper's four keep their published rules"
    M_vocabulary_check: "2026-11-07, drug-name counts only: the eICU medication table has no CKD, oral cancer, dementia, HIV, rheumatic or PVD drugs (0 rows each), though admissionDrug has them (dementia about 4,100 rows, HIV 690, rheumatic 620, PVD 670)"
    A: "home medication (eICU admissionDrug), for conditions whose specific drugs are absent from the medication table; chosen by the user 2026-11-07 ('Use home meds (DHA)'); drug lists in configs/phenotypes_scan.yaml, approved first"
    by_condition:
      DHM: [diabetes, hypertension, chf, af, chronic_pulmonary_disease, liver_disease]  # specific drugs present in the in-stay table
      DHA: [dementia, aids, rheumatic_disease, peripheral_vascular_disease, renal_disease, cancer]  # specific drugs only in admissionDrug
    three_source_rule: "an angle needs three sources (7 lobes), as in the paper's DAS definition; chosen by the user 2026-11-07 ('Yes, drop them')"
    dropped_by_rule:
      myocardial_infarct: "no condition-specific drug class (antiplatelets, beta blockers, statins shared)"
      cerebrovascular_disease: "no condition-specific drug class (antiplatelets, anticoagulants, statins shared)"
      peptic_ulcer_disease: "no condition-specific drug class (PPIs and H2 blockers given as prophylaxis)"
      paraplegia: "no condition-specific drug class (baclofen shared with other spasticity)"
      obesity: "no history or medication source in eICU; the BMI-anchored D-U profile has 2 lobes"
    screened: "12 conditions: the paper's four, chronic_pulmonary_disease, liver_disease, dementia, aids, rheumatic_disease, peripheral_vascular_disease, renal_disease, cancer"
    no_home_med_hospitals: "89 eICU hospitals have no admissionDrug record; their DHA profiles hold D and H lobes only, as for DAM and DHAM in part 1; each DHA contrast is also reported for targets with home-medication data"
    source: "the Charlson definitions are the same ones that build the Charlson score in every task model"
  construct: "per sources.by_condition: DHM or DHA, 7 lobes each, labeled"
  gate1_hospital_profile:
    rule: "a hospital has a profile for a condition if its evidence-positive patients reach n*, the smallest n at which the split-half reliability of hospitals' angle to the pooled eICU profile reaches 0.80 (Spearman-Brown corrected)"
    n_grid: [25, 50, 75, 100, 150, 200]
    method: "for each n, hospitals with >= 2n evidence-positive patients; draw two disjoint samples of n patients per hospital, 20 times; reliability = Spearman correlation of the two angles across hospitals, Spearman-Brown corrected to n"
    fallback: "if no n in the grid reaches 0.80, the condition is dropped: no reliable profile"
    justification: "0.80 is the standard reliability bar for research measures (Nunnally JC, Bernstein IH. Psychometric Theory, 3rd ed. McGraw-Hill; 1994); split-half reliability corrected with the Spearman-Brown formula (Spearman 1910; Brown 1910, Br J Psychol 3); no outcome is used"
    paper_check: "the paper's n = 100 is reported against this rule for the four paper conditions"
  gate1_pairwise:  # revised gate 1, approved and locked by the user 2026-11-07 ('Ok'); replaces gate1_hospital_profile for scoring, which stays reported
    status: locked
    rule: "a hospital has a profile for a condition if its evidence-positive patients reach n*, the smallest grid n at which the split-half reliability of the pairwise hospital angles reaches 0.80 and the hospitals entering the estimate include >= 32 of the 41 development targets"
    n_grid: [25, 50, 75, 100, 150, 200]
    method: "for each n, hospitals with >= 2n evidence-positive patients; two disjoint samples of n patients per hospital, 20 draws; from each sample, the angle between every pair of hospitals over the 7 lobes; reliability = Spearman correlation of the two sets of pair angles, mean over draws"
    min_targets: "the hospitals entering the estimate at that n include >= 32 of the 41 development targets (the gate 2 number)"
    justification: "nearest 10 chooses donors by pairwise angles, so the reliability is taken on pairwise angles; bar 0.80 (Nunnally and Bernstein 1994); correlation of two distance matrices as in Mantel N, Cancer Res 1967;27:209-20; no outcome is used"
  gate1_full:  # full-data gate 1, chosen by the user 2026-11-07 ('Yes, use full data'; floor 'Paper's 100'), locked before it was run; used for scoring; gate1_hospital_profile and gate1_pairwise stay reported
    status: locked
    rule: "a condition passes if the split-half reliability of the pairwise hospital angles, using all of each hospital's evidence-positive patients and corrected to full size, reaches 0.80, among hospitals with >= 100 evidence-positive stays, and those hospitals include >= 32 of the 41 development targets"
    floor: "100 evidence-positive stays per hospital, the paper's DAS minimum"
    method: "each hospital's evidence-positive stays split at random into two halves, 20 draws; from each half, the angle between every pair of hospitals over the 7 lobes; Spearman correlation of the two sets of pair angles, mean over draws; Spearman-Brown corrected to full size, 2r / (1 + r)"
    gate2: "a development target has a profile if it has >= 100 evidence-positive stays; >= 32 of 41 per task, as gate2_targets"
    justification: "scoring uses all of a hospital's patients, so the reliability is taken at full size; bar 0.80 (Nunnally and Bernstein 1994); Spearman-Brown (Spearman 1910; Brown 1910); matrix correlation as Mantel 1967; floor from the paper; no outcome is used"
  gate2_targets:
    rule: ">= 32 of the 41 development targets have a profile (gate 1)"
    justification: "precision sample size n = (z x SD / E)^2 (Cochran WG. Sampling Techniques, 3rd ed. Wiley; 1977): z = 1.96, E = 0.010 AUROC, the smallest gain the design treats as worth finding (the approved ablation bar and ceiling stop rule), SD = 0.0286, the median SD across development targets of the gain over random 10 of the ten paper DAS arms on A3 and A6 (task_ceiling_targets_construct.csv); n = 31.4, rounded up to 32; chosen by the user 2026-11-07 ('Precision rule, 32') over a detection rule, because 80% power to detect 0.010 (one-sided 0.05) needs 51 targets and the development half has 41"
    power_stated: "one-sided 0.05: power to detect a 0.010 gain is 64% at 32 targets and 72% at 41; the smallest gain detectable with 80% power is 0.012 at 32 targets and 0.011 at 41; stated in the paper"
  B1: "not a gate and not in the main text; one supplementary sensitivity table shows B1 per angle and that it did not predict transfer (CHF 0.38, AF 0.33)"
  candidates: "nearest 10 by the condition's angle, per task, for every condition passing both gates and not already in the ledger; joined over all passing conditions; counted in the ledger"
  contrasts:
    vs_random: "gain over random 10, as every earlier candidate"
    vs_chf: "paired difference against nearest 10 by the CHF DHM angle, same targets"
  data: "development half only"
  multiplicity: "no Holm correction, by the user's choice 2026-11-07 ('No Holm, as before'), as in A_task_screen_ext; a candidate passes if mean gain > 0 and the lower 95% target-bootstrap bound > 0; the Holm-adjusted p is still reported"
  winner: "only with the user's approval"
  confirmation: "the user's choice 2026-11-07 ('Re-use, labeled'): a winner is confirmed on the same eICU confirmation half already read in W1 and W3, labeled not independent; MIMIC-IV stays the independent test"
  medication_rules: "configs/phenotypes_scan.yaml with the proposed exclusions, approved by the user 2026-11-07 ('Exclude it' for ipratropium; 'Approve exclusions' for cancer and renal)"
  added_version:
    DHMany: "added by the user 2026-11-07 ('Add it'): one more construct with home and in-stay medication merged into one medication source (D, H, A or M; 7 lobes), for the paper's four and joined, both tasks (10 candidates), paired against DHM as in part 1"
  limitation: "the diagnosis source differs in meaning between the datasets (eICU: clinician problem list during the stay; MIMIC-IV: post-discharge billing codes); stated as a limitation, not corrected"
  seed: 20261121

